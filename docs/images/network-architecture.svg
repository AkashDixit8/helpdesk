<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="100%" height="100%">
  <rect width="900" height="350" fill="#0f172a" rx="10"/>
  
  <text x="450" y="35" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Network Topology &amp; Security Group Cascading</text>
  
  <!-- Internet -->
  <circle cx="90" cy="180" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="90" y="185" fill="#38bdf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Internet</text>

  <!-- Security Group 1 -->
  <rect x="200" y="100" width="180" height="160" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="290" y="125" fill="#34d399" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">helpdesk-alb-sg</text>
  <rect x="220" y="145" width="140" height="90" fill="#0f172a" rx="6"/>
  <text x="290" y="175" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Inbound: Port 80</text>
  <text x="290" y="200" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Source: 0.0.0.0/0</text>

  <!-- Security Group 2 -->
  <rect x="430" y="100" width="190" height="160" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" rx="8"/>
  <text x="525" y="125" fill="#a78bfa" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">helpdesk-backend-sg</text>
  <rect x="450" y="145" width="150" height="90" fill="#0f172a" rx="6"/>
  <text x="525" y="175" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Inbound: Port 5000</text>
  <text x="525" y="200" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Source: helpdesk-alb-sg</text>

  <!-- Security Group 3 -->
  <rect x="670" y="100" width="180" height="160" fill="#1e293b" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="760" y="125" fill="#f87171" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">helpdesk-rds-sg</text>
  <rect x="690" y="145" width="140" height="90" fill="#0f172a" rx="6"/>
  <text x="760" y="175" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Inbound: Port 3306</text>
  <text x="760" y="200" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Source: backend-sg</text>

  <!-- Connectors -->
  <line x1="135" y1="180" x2="200" y2="180" stroke="#38bdf8" stroke-width="2"/>
  <line x1="380" y1="180" x2="430" y2="180" stroke="#38bdf8" stroke-width="2"/>
  <line x1="620" y1="180" x2="670" y2="180" stroke="#38bdf8" stroke-width="2"/>
</svg>
