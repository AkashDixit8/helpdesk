<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <rect width="900" height="420" fill="#0f172a" rx="10"/>
  
  <text x="450" y="35" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Helpdesk SaaS - AWS System Architecture</text>
  
  <!-- Client Tier -->
  <rect x="30" y="80" width="140" height="280" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="100" y="110" fill="#60a5fa" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Client Tier</text>
  <rect x="45" y="140" width="110" height="60" fill="#334155" rx="6"/>
  <text x="100" y="175" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Users / Web</text>
  <rect x="45" y="240" width="110" height="60" fill="#334155" rx="6"/>
  <text x="100" y="275" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Route 53 DNS</text>

  <!-- AWS VPC -->
  <rect x="210" y="70" width="660" height="310" fill="#1e293b" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6" rx="8"/>
  <text x="230" y="95" fill="#fbbf24" font-family="Arial, sans-serif" font-size="14" font-weight="bold">AWS VPC (10.0.0.0/16)</text>

  <!-- Public Subnet -->
  <rect x="230" y="115" width="180" height="240" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="6"/>
  <text x="320" y="135" fill="#34d399" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Public Subnets</text>
  <rect x="250" y="160" width="140" height="70" fill="#1e293b" stroke="#10b981" stroke-width="1" rx="6"/>
  <text x="320" y="195" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">ALB (Load Balancer)</text>
  <rect x="250" y="260" width="140" height="70" fill="#1e293b" stroke="#10b981" stroke-width="1" rx="6"/>
  <text x="320" y="295" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">NAT Gateway</text>

  <!-- Private Subnet (Compute) -->
  <rect x="440" y="115" width="200" height="240" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" rx="6"/>
  <text x="540" y="135" fill="#a78bfa" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Private App Subnets</text>
  <rect x="460" y="160" width="160" height="70" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" rx="6"/>
  <text x="540" y="190" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">ECS Fargate Tasks</text>
  <text x="540" y="210" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">(React + Express)</text>
  <rect x="460" y="260" width="160" height="70" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" rx="6"/>
  <text x="540" y="295" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">AWS ECR Registry</text>

  <!-- Private DB Subnet -->
  <rect x="670" y="115" width="180" height="240" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="760" y="135" fill="#f87171" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Private DB Subnets</text>
  <rect x="690" y="200" width="140" height="80" fill="#1e293b" stroke="#ef4444" stroke-width="1" rx="6"/>
  <text x="760" y="235" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Amazon RDS</text>
  <text x="760" y="255" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">(MySQL Database)</text>

  <!-- Arrows -->
  <line x1="170" y1="220" x2="250" y2="195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="195" x2="460" y2="195" stroke="#38bdf8" stroke-width="2"/>
  <line x1="620" y1="195" x2="690" y2="240" stroke="#38bdf8" stroke-width="2"/>
  <line x1="540" y1="230" x2="540" y2="260" stroke="#38bdf8" stroke-dasharray="4,4" stroke-width="1.5"/>
</svg>
